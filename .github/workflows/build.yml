name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Use the latest published compiler
        run: dotnet tool update --local ghul.compiler

      - name: Build
        run: dotnet build ghul-dashboard.ghulproj

      - name: Unit tests
        run: dotnet test tests

      # Renders one frame and checks the panel headings are present. There is
      # no workspace on the runner, so this exercises the argument handling and
      # the not-a-workspace path rather than any collector.
      - name: Smoke test
        run: |
          set -o pipefail
          dotnet run --no-build -- --help | tee help.out
          grep -q -- '--interval' help.out
          if dotnet run --no-build -- --once > once.out 2>&1; then
            grep -qi 'sessions' once.out
          else
            grep -qi 'not inside a ghūl workspace' once.out
          fi

  code_review:
    name: Code review
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: degory/ghul-code-review/.github/workflows/review.yml@v4
    with:
      idle-timeout-seconds: ${{ fromJSON(vars.CLAUDE_REVIEW_IDLE_TIMEOUT_SECONDS || '90') }}
      max-attempts: ${{ fromJSON(vars.CLAUDE_REVIEW_MAX_ATTEMPTS || '3') }}
      gh-app-id: ${{ vars.GHUL_REVIEWER_APP_ID }}
      ghul-reference: true
      prompt: |
        Review pull request #${{ github.event.pull_request.number }} on ${{ github.repository }}.

        You run in parallel with CI. Whether the diff builds and passes tests is gated by CI before merge — that's not your job. Trust the diff as written.

        Read these files first, in order:
        1. .github/claude-review.md — what this repo is, and what to watch for in it
        2. GHUL.md — ghūl language reference (consult as needed while reading the diff)
    secrets:
      claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      qwen-auth-token: ${{ secrets.OPENCODE_API_KEY }}
      gh-app-private-key: ${{ secrets.GHUL_REVIEWER_PRIVATE_KEY }}
